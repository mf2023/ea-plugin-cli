[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-plugin-cli"
version = "0.1.0"
description = "Encre Agent plugin market unified CLI — scaffold, build, verify and publish ea-plugin-* packages"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["encre", "plugin", "market", "cli", "publish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "build>=1.0",
    "twine>=5.0",
    "ea-cwh>=0.1.0",
]

[project.scripts]
encre-plugin = "ea_plugin_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_plugin_cli*"]
