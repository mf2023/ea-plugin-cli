# Publish-on-push for the ea-plugin-cli package.
#
# Every push to main re-releases the CLI to PyPI as 0.<YYYYMMDD>.<run> so
# `pip install ea-plugin-cli` always resolves to the latest build.  The
# repository pyproject keeps its template version; CI stamps the release
# version into the built wheel only (no commit back — pushing the stamp
# would retrigger this workflow).  PyPI credentials come from the
# PYPI_API_TOKEN repository secret (an account-wide token created on
# pypi.org — reuse the ea-cwh one).
name: publish-cli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Lint and compile-check
        run: |
          python -m pip install ruff
          ruff check ea_plugin_cli/
          ruff format --check ea_plugin_cli/
          python -m py_compile ea_plugin_cli/__main__.py ea_plugin_cli/rules.py ea_plugin_cli/__init__.py pyi_entry.py

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Stamp the release version
        run: |
          VERSION="0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the wheel
        run: python -m build

      - name: Publish ea-plugin-cli to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea-plugin-cli-${{ env.version }}
          path: dist/
